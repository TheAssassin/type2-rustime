[package]
name = "type2-rustime"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "color", "env"] }
daemonize = "0.5.0"
elf = "0.8.0"
squashfuse-rs = "0.3.0"
tempfile = "3.27.0"
backhand = "0.18.0"
fuser = "0.14.0"
pretty_env_logger = "0.5.0"
log = "0.4.34"
anyhow = "1.0.104"
subprocess = "1.2.1"

[profile.release]
lto = true
debug  = false
opt-level = "z"
strip = "symbols"
codegen-units = 1
panic = "abort"
