name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - appimage_arch: x86_64
            runner: ubuntu-24.04
          #- appimage_arch: aarch64
          #  runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    # build in Alpine container which causes cargo to build fully static binary
    container: rust:alpine

    steps:
      - name: Install Rust
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          apk add git musl-dev fuse3-dev fuse3-static upx gcc curl nodejs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          export PATH="${PATH}:$HOME/.cargo/bin"
          RUST_TARGET="${ARCH}-unknown-linux-musl"
          rustup target add "${RUST_TARGET}"
          echo "RUST_TARGET=${RUST_TARGET}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache for Rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Test
        run: cargo test --target "${RUST_TARGET}"

      - name: Build
        run: cargo build --release --target "${RUST_TARGET}"

      - name: Rename binaries and minify with upx
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          mv "target/${RUST_TARGET}/release/type2-rustime" "type2-rustime-${ARCH}"
          upx -o "type2-rustime-upx-${ARCH}" "type2-rustime-${ARCH}"
          strip "type2-rustime-${ARCH}"*

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts ${{ matrix.appimage_arch }}
          path: type2-rustime*

  upload:
    name: Create release and upload artifacts
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
          chmod +x pyuploadtool-x86_64.AppImage
          GITHUB_CONTINUOUS_RELEASE_TYPE=stable ./pyuploadtool-x86_64.AppImage --appimage-extract-and-run type2-rustime*
